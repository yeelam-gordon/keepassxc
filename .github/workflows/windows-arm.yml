name: "Windows Arm64"

# Native Windows on Arm build/package/test proof lane. Runs on GitHub-hosted
# windows-11-arm runners (GA, free for public repos) with a native Arm64
# vcpkg dependency closure, packaged through the same release-tool.py path
# used for x64 releases (ZIP + WIX), and executes tests on the installed
# build rather than only compiling it. Signing/publication remain out of
# scope (maintainer-owned).
#
# The KeePassXC application payload (EXE/DLLs) is native Arm64. WiX v3's
# candle.exe/light.exe/heat.exe are x86 (PE machine 0x014C) and therefore run
# under Windows x86 emulation on this runner; that is an accepted WiX v3
# tooling limitation, not an application-payload defect.
#
# This job runs on the current windows-11-arm hosted image. The planned
# September 2026 VS2026 hosted-runner image migration is an unvalidated gate:
# this workflow does not pin an image version and does not assume the
# migrated image will pass unchanged.

on:
  push:
    branches:
      - 'develop'
      - 'release/**'
    paths:
      - '.github/workflows/windows-arm.yml'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'vcpkg/**'
      - 'release-tool.py'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/windows-arm.yml'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'vcpkg/**'
      - 'release-tool.py'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  build:
    name: Build, package, and test (arm64-windows)
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install WiX Toolset (candle/light/heat)
        run: choco install wixtoolset -y --no-progress
        shell: pwsh

      - name: Resolve WiX bin directory onto PATH
        # Chocolatey's wixtoolset install updates machine/user environment variables,
        # but those changes are not visible in the current process (or subsequent
        # Actions steps) without a shell restart. Rather than rely on Chocolatey's
        # own PATH refresh, deterministically locate the single directory that
        # contains candle.exe, light.exe, and heat.exe together, fail explicitly
        # if no such directory is found, and propagate it ourselves.
        run: |
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
          $candidates = foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Filter 'candle.exe' -ErrorAction SilentlyContinue |
                ForEach-Object { $_.DirectoryName }
            }
          }

          $wixDir = $candidates |
            Sort-Object -Unique |
            Where-Object {
              (Test-Path (Join-Path $_ 'candle.exe')) -and
              (Test-Path (Join-Path $_ 'light.exe')) -and
              (Test-Path (Join-Path $_ 'heat.exe'))
            } |
            Select-Object -First 1

          if (-not $wixDir) {
            throw "Could not find a single directory containing candle.exe, light.exe, and heat.exe under $($roots -join ', '). WiX layout may have changed."
          }

          Write-Host "Found WiX bin directory at $wixDir"

          # Add to the current step's PATH so the tools are usable immediately,
          # and to $GITHUB_PATH so it persists on PATH for all subsequent steps.
          $env:PATH = "$wixDir;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $wixDir

          & candle.exe -? | Select-Object -First 1
          & light.exe -? | Select-Object -First 1
          & heat.exe -? | Select-Object -First 1
        shell: pwsh

      - name: Resolve Git-bundled gpg.exe onto PATH
        # GnuPG isn't used for this unsigned CI proof build, but release-tool.py's
        # basic checks unconditionally require `gpg` on PATH regardless of platform.
        # Chocolatey's gnupg package hangs on this runner (F-ARM-1), so reuse the
        # gpg.exe already bundled with the runner's preinstalled Git for Windows
        # instead of installing a separate GnuPG package.
        run: |
          $gitCmd = Get-Command git -ErrorAction SilentlyContinue
          if (-not $gitCmd) { throw "git not found on PATH; cannot locate bundled gpg.exe" }

          $gitDir = Split-Path -Parent $gitCmd.Source
          # Git for Windows ships gpg.exe under <git-root>\usr\bin relative to cmd\git.exe.
          $gpgDir = Join-Path (Split-Path -Parent $gitDir) 'usr\bin'
          $gpgPath = Join-Path $gpgDir 'gpg.exe'

          if (-not (Test-Path $gpgPath)) {
            throw "Expected Git-bundled gpg.exe not found at $gpgPath"
          }

          Write-Host "Found Git-bundled gpg.exe at $gpgPath"

          # Add to the current step's PATH so gpg is usable immediately if needed,
          # and to $GITHUB_PATH so it persists on PATH for all subsequent steps.
          $env:PATH = "$gpgDir;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $gpgDir

          & gpg.exe --version | Select-Object -First 1
        shell: pwsh

      - name: Confirm required tools are on PATH
        run: |
          $tools = 'cmake', 'ctest', 'cpack', 'candle', 'light', 'heat', 'gpg'
          foreach ($tool in $tools) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "Required tool not found on PATH: $tool" }
            Write-Host "$tool -> $($cmd.Source)"
          }
          Write-Host "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
        shell: pwsh

      - name: Build, package (ZIP + WIX), and test on native Arm64
        run: >
          python release-tool.py build 0.0.0
          --src-dir .
          --output-dir release
          --platform-target arm64
          --with-tests
          --yes
          --snapshot
        shell: pwsh

      - name: Verify packaged artifacts are Arm64-only
        run: |
          $artifacts = Get-ChildItem -Path release -Include *.zip, *.msi -Recurse
          if (-not $artifacts) { throw 'No release artifacts were produced.' }
          foreach ($artifact in $artifacts) {
            Write-Host "Found artifact: $($artifact.Name)"
            if ($artifact.Name -notmatch 'arm64') {
              throw "Artifact name does not indicate an Arm64 build: $($artifact.Name)"
            }
          }
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keepassxc-windows-arm64-snapshot
          path: release/*
          retention-days: 14
